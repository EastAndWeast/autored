name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.lock

      - name: Install Chromium (Linux with system deps)
        if: runner.os == 'Linux'
        run: python -m patchright install chromium --with-deps

      - name: Install Chromium (macOS / Windows)
        if: runner.os != 'Linux'
        run: python -m patchright install chromium

      - name: Run test suite
        env:
          XHS_DATA_DIR: ${{ runner.temp }}/xhs_ci_data
        shell: python
        run: |
          import sys, os, time, unittest

          def run_suite():
              sys.path.insert(0, os.getcwd())
              suite = unittest.TestLoader().discover("tests")
              runner = unittest.TextTestRunner(verbosity=1, stream=sys.stdout)
              result = runner.run(suite)
              sys.stdout.flush(); sys.stderr.flush()
              ok = result.wasSuccessful()
              print(f"SUMMARY: ran={result.testsRun} failures={len(result.failures)} errors={len(result.errors)} skipped={len(result.skipped)} ok={ok}")
              return ok

          # Windows runner 的 vctip.exe(VS 遥测)会间歇性向进程组发 Ctrl+C,
          # 打断正常测试(STATUS_CONTROL_C_EXIT)。失败后自动重跑一次吸收干扰。
          # Windows runner 的 vctip.exe 等会以 KeyboardInterrupt 形式打断套件,
          # 必须捕获异常本身(仅靠返回值重试拦不住)
          for attempt in (1, 2):
              try:
                  ok = run_suite()
              except BaseException as e:  # noqa: BLE001  含 KeyboardInterrupt
                  print(f"[CI] 第 {attempt} 次套件被外部中断: {type(e).__name__}")
                  ok = False
              if ok:
                  break
              if attempt == 1:
                  print("[CI] 10 秒后自动重跑一次(吸收 runner 环境瞬时干扰)…")
                  time.sleep(10)
          os._exit(0 if ok else 1)

      - name: MCP stdio smoke (initialize + tools/list)
        env:
          XHS_DATA_DIR: ${{ runner.temp }}/xhs_ci_data
        shell: python
        run: |
          import json, subprocess, sys
          reqs = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05", "capabilities": {}, "clientInfo": {"name": "ci", "version": "1"}}},
              {"jsonrpc": "2.0", "method": "notifications/initialized"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]
          p = subprocess.run(
              [sys.executable, "-m", "app.mcp.server"],
              input="\n".join(json.dumps(r) for r in reqs) + "\n",
              capture_output=True, text=True, encoding="utf-8", errors="replace", timeout=60,
          )
          tools = None
          for line in p.stdout.splitlines():
              try:
                  d = json.loads(line)
              except Exception:
                  continue
              if d.get("id") == 2:
                  tools = d["result"]["tools"]
          assert tools and len(tools) >= 10, f"MCP tools/list failed: rc={p.returncode}, stderr={p.stderr[-500:]}"
          print(f"MCP OK: {len(tools)} tools")

      - name: Installer smoke
        env:
          CI: "1"
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c install.bat
            PY="venv/Scripts/python.exe"
          else
            bash install.sh
            PY="venv/bin/python"
          fi
          test -f "$PY"
          python - <<'PYCHECK'
          import json
          json.load(open("mcp.generated.json", encoding="utf-8"))
          c = json.load(open("skills/workbuddy/connector.json", encoding="utf-8"))
          assert "{{" not in open("skills/workbuddy/connector.json", encoding="utf-8").read(), "模板占位符未渲染"
          assert len(c["args"]) >= 1
          print("installer artifacts OK")
          PYCHECK

      - name: Smoke — service health (headless start)
        env:
          XHS_DATA_DIR: ${{ runner.temp }}/xhs_ci_data
        shell: python
        run: |
          import json, subprocess, sys, time, urllib.request, os
          from pathlib import Path
          log = open(Path("server_smoke.log"), "w")
          p = subprocess.Popen(
              [sys.executable, "run.py"],
              stdout=log, stderr=subprocess.STDOUT,
          )
          ok = False
          for _ in range(45):
              time.sleep(1)
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8643/api/health", timeout=2) as r:
                      if json.loads(r.read()).get("ok"):
                          ok = True
                          break
              except Exception:
                  continue
          p.terminate()
          log.close()
          assert ok, "服务 45 秒内未通过 /api/health, 见 server_smoke.log"
          print("service health OK")
